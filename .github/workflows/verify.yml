name: Verify API

on:
  pull_request:
  push:
    branches: [main, development]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: prisma+postgres://accelerate.prisma-data.net/?api_key=ci-placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Run automated tests
        run: npm test

      - name: Check OpenAPI and generated Postman artifacts
        run: npm run api:artifacts:check
