name: Database backup

# Daily off-site backup of the production database into the PRIVATE R2
# bucket, keeping the newest 14. Free: a couple of GitHub Actions minutes a
# day, a few MB of R2. Restore steps: foundry_lms_docs/
# 2026-10-01_database_backup_and_restore_guide.md
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   BACKUP_DATABASE_URL   direct postgres:// connection string (not the
#                         prisma+postgres:// Accelerate URL)
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_PRIVATE_BUCKET

on:
  schedule:
    - cron: "30 20 * * *" # 20:30 UTC = 02:00 in Sri Lanka
  workflow_dispatch: # "Run workflow" button for an on-demand backup

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Only the AWS SDK is needed for the upload script; skipping install
      # scripts avoids an unnecessary `prisma generate`.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # pg_dump must be at least as new as the database server (Postgres 17).
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      # Custom format (-Fc) is compressed and restores with pg_restore.
      # No owner/privilege statements, so it restores into any fresh database.
      - name: Dump database
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          test -n "$BACKUP_DATABASE_URL" || { echo "BACKUP_DATABASE_URL secret is not set."; exit 1; }
          /usr/lib/postgresql/17/bin/pg_dump --format=custom --no-owner --no-privileges --file=backup.dump "$BACKUP_DATABASE_URL"
          ls -lh backup.dump

      - name: Upload to R2 and prune old backups
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PRIVATE_BUCKET: ${{ secrets.R2_PRIVATE_BUCKET }}
          BACKUP_PREFIX: backups/
          BACKUP_RETENTION_COUNT: "14"
        run: node scripts/upload-database-backup.js backup.dump
