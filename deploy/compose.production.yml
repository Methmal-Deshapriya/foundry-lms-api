name: foundry-lms

# Production topology for the GreenCloud VPS.
#
# Nothing publishes a host port. Cloudflare Tunnel makes outbound connections
# to Cloudflare and reaches web/api over the edge network. PostgreSQL is only
# attached to the internal private network.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-app-security: &app-security
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    env_file:
      - ${FOUNDRY_ENV_DIR:-/opt/foundry-lms/env}/db.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    shm_size: 128m
    mem_limit: 768m
    pids_limit: 200
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - private
    logging: *default-logging

  migrate:
    image: foundry-lms-api-migrate:${APP_TAG:?Set APP_TAG in deploy.env}
    pull_policy: never
    restart: "no"
    env_file:
      - ${FOUNDRY_ENV_DIR:-/opt/foundry-lms/env}/api.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private
    mem_limit: 768m
    pids_limit: 200
    <<: *app-security
    logging: *default-logging

  api:
    image: foundry-lms-api:${APP_TAG:?Set APP_TAG in deploy.env}
    pull_policy: never
    restart: unless-stopped
    env_file:
      - ${FOUNDRY_ENV_DIR:-/opt/foundry-lms/env}/api.env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - private
      - edge
    mem_limit: 768m
    pids_limit: 300
    stop_grace_period: 30s
    <<: *app-security
    logging: *default-logging

  web:
    image: foundry-lms-web:${APP_TAG:?Set APP_TAG in deploy.env}
    pull_policy: never
    restart: unless-stopped
    env_file:
      - ${FOUNDRY_ENV_DIR:-/opt/foundry-lms/env}/web.env
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    mem_limit: 512m
    pids_limit: 200
    stop_grace_period: 30s
    <<: *app-security
    logging: *default-logging

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file:
      - ${FOUNDRY_ENV_DIR:-/opt/foundry-lms/env}/cloudflared.env
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - edge
    mem_limit: 256m
    pids_limit: 100
    <<: *app-security
    logging: *default-logging

networks:
  private:
    internal: true
  edge:

volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME_NAME:-foundry-lms-postgres-data}
