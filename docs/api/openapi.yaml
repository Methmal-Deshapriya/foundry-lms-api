  schemas:
    SuccessEnvelope:
      type: object
      required: [success]
      properties:
        success: { type: boolean, example: true }
        data: {}
        message: { type: string, example: Success }
    ErrorEnvelope:
      type: object
      required: [success, error, code]
      properties:
        success: { type: boolean, example: false }
        error: { type: string }
        code: { type: string }
        field: { type: string, nullable: true }
        details: { nullable: true }
    SequenceRiskEnvelope:
      type: object
      required: [success, error, code, details]
      properties:
        success: { type: boolean, example: false }
        error: { type: string }
        code:
          type: string
          enum: [SEQUENCE_RISK_CONFIRMATION_REQUIRED]
        details:
          type: object
          required: [blockingSessions]
          properties:
            blockingSessions:
              type: array
              items: { type: object }
    CatalogDeletionBlockedEnvelope:
      type: object
      required: [success, error, code, details]
      properties:
        success: { type: boolean, example: false }
        error:
          type: string
          example: Permanent deletion is blocked because this catalog item contains curriculum or learner history.
        code:
          type: string
          enum: [CATALOG_DELETION_BLOCKED]
        details:
          $ref: "#/components/schemas/CatalogDeletionImpact"
    CatalogDeletionImpact:
