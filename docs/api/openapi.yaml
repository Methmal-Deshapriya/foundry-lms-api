openapi: 3.0.3
info:
  title: Foundry Academy LMS API
  version: 1.0.0
  description: |
    Canonical API contract for the Foundry Academy LMS.

    Authentication uses the HTTP-only `token` cookie. In Postman, run Login or
    Verify email OTP first and allow Postman's cookie jar to retain the cookie.
    Admin and super-admin requests require an account with the matching backend
    permission.
servers:
  - url: "{baseUrl}"
    description: Selected Foundry LMS API server
    variables:
      baseUrl:
        default: http://localhost:5000
tags:
  - name: 00 System
  - name: 01 Authentication
  - name: 02 Users
  - name: 03 Public Catalog
  - name: 04 Categories
  - name: 05 Course Groups
  - name: 06 Course Intakes
  - name: 07 Session Library
  - name: 08 Course Curriculum & Delivery
  - name: 09 Enrollments & Classroom
  - name: 10 Certificates
  - name: 11 Projects
  - name: 12 Audit Logs
  - name: 13 Service Overview
security:
  - cookieAuth: []
paths:
  /api/ready:
    get:
      tags: [00 System]
      operationId: readiness
      summary: Check API database readiness
      x-access: PUBLIC
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "503":
          description: Database unavailable

  /api/health:
    get:
      tags: [00 System]
      operationId: getHealth
      summary: Check API health
      x-access: PUBLIC
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/services/summary:
    get:
      tags: [13 Service Overview]
      operationId: getAdminLearningServiceSummaries
      summary: Get learning-service administration summaries
      x-access: ADMIN
      description: Compatibility alias for the database-backed learning-service list. Returns every configured service with catalog, learner, curriculum, course-intake, payment-attention, and lifecycle aggregates.
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/services:
    get:
      tags: [13 Service Overview]
      operationId: listLearningServices
      summary: List learning services and administration summaries
      x-access: ADMIN
      parameters:
        - $ref: "#/components/parameters/LearningServiceStatusFilter"
        - $ref: "#/components/parameters/IncludeArchived"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    post:
      tags: [13 Service Overview]
      operationId: createLearningService
      summary: Create a learning service as Draft
      x-access: SUPER_ADMIN
      description: Super-admin only. The initial release supports either paid seasonal/admin-enrolled services or free evergreen/self-enrolled services.
      requestBody:
        $ref: "#/components/requestBodies/CreateLearningService"
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /api/v1/services/{learningServiceId}:
    get:
      tags: [13 Service Overview]
      operationId: getLearningService
      summary: Get a learning service and administration summary
      x-access: ADMIN
      parameters:
        - $ref: "#/components/parameters/LearningServiceId"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    patch:
      tags: [13 Service Overview]
      operationId: updateLearningService
      summary: Update a Draft learning service
      x-access: SUPER_ADMIN
      description: Super-admin only. Identity and policy are protected after categories or courses depend on the service; the stable key is never mutable.
      parameters:
        - $ref: "#/components/parameters/LearningServiceId"
      requestBody:
        $ref: "#/components/requestBodies/UpdateLearningService"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    delete:
      tags: [13 Service Overview]
      operationId: deleteLearningServicePermanently
      summary: "[DESTRUCTIVE] Permanently delete an archived empty learning service"
      x-access: SUPER_ADMIN
      description: Super-admin only. Permanent deletion requires Archived status and no categories or protected descendant history.
      parameters:
        - $ref: "#/components/parameters/LearningServiceId"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "409":
          $ref: "#/components/responses/CatalogDeletionBlocked"

  /api/v1/services/{learningServiceId}/deletion-impact:
    get:
      tags: [13 Service Overview]
      operationId: getLearningServiceDeletionImpact
      summary: Preview whether permanent service deletion is safe
      x-access: SUPER_ADMIN
      parameters:
        - $ref: "#/components/parameters/LearningServiceId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/services/{learningServiceId}/activate:
    patch:
      tags: [13 Service Overview]
      operationId: activateLearningService
      summary: Activate a Draft learning service
      x-access: SUPER_ADMIN
      parameters:
        - $ref: "#/components/parameters/LearningServiceId"
      requestBody:
        $ref: "#/components/requestBodies/TransitionLearningServiceStatus"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/services/{learningServiceId}/deactivate:
    patch:
      tags: [13 Service Overview]
      operationId: deactivateLearningService
      summary: Return an Active learning service to Draft
      x-access: SUPER_ADMIN
      parameters:
        - $ref: "#/components/parameters/LearningServiceId"
      requestBody:
        $ref: "#/components/requestBodies/TransitionLearningServiceStatus"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/services/{learningServiceId}/archive:
    patch:
      tags: [13 Service Overview]
      operationId: archiveLearningService
      summary: Archive an inactive learning service
      x-access: SUPER_ADMIN
      description: Live courses or enrollments block archival.
      parameters:
        - $ref: "#/components/parameters/LearningServiceId"
      requestBody:
        $ref: "#/components/requestBodies/TransitionLearningServiceStatus"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/services/{learningServiceId}/unarchive:
    patch:
      tags: [13 Service Overview]
      operationId: unarchiveLearningService
      summary: Restore an Archived learning service as Draft
      x-access: SUPER_ADMIN
      parameters:
        - $ref: "#/components/parameters/LearningServiceId"
      requestBody:
        $ref: "#/components/requestBodies/TransitionLearningServiceStatus"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/postman/collection:
    get:
      tags: [00 System]
      operationId: downloadPostmanCollection
      summary: Download latest Postman collection
      x-access: PUBLIC
      description: Returns the raw generated collection for direct URL import into Postman.
      security: []
      responses:
        "200":
          description: Postman Collection v2.1 JSON
          content:
            application/json:
              schema: { type: object }

  /api/postman/environment:
    get:
      tags: [00 System]
      operationId: downloadPostmanEnvironment
      summary: Download safe Postman environment
      x-access: PUBLIC
      description: Returns the raw local environment with blank credentials and destructive requests disabled.
      security: []
      responses:
        "200":
          description: Postman environment JSON
          content:
            application/json:
              schema: { type: object }

  /api/v1/auth/register:
    post:
      tags: [01 Authentication]
      operationId: registerStudent
      summary: Register student
      x-access: PUBLIC
      security: []
      requestBody:
        $ref: "#/components/requestBodies/Register"
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /api/v1/auth/login:
    post:
      tags: [01 Authentication]
      operationId: login
      summary: Login
      x-access: PUBLIC
      description: Sets the HTTP-only authentication cookie used by protected requests.
      security: []
      requestBody:
        $ref: "#/components/requestBodies/Login"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/auth/verify-login-challenge:
    post:
      tags: [01 Authentication]
      operationId: verifyAdministratorLogin
      summary: Verify administrator login code
      x-access: PUBLIC
      description: Consumes a short-lived administrator email challenge and sets the HTTP-only authentication cookie.
      security: []
      requestBody:
        $ref: "#/components/requestBodies/VerifyLoginChallenge"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/auth/logout:
    post:
      tags: [01 Authentication]
      operationId: logout
      summary: Logout
      x-access: PUBLIC
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/auth/me:
    get:
      tags: [01 Authentication]
      operationId: getCurrentUser
      summary: Get current user
      x-access: AUTHENTICATED
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/auth/forgot-password:
    post:
      tags: [01 Authentication]
      operationId: forgotPassword
      summary: Request password reset
      x-access: PUBLIC
      security: []
      requestBody:
        $ref: "#/components/requestBodies/Email"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/auth/reset-password:
    post:
      tags: [01 Authentication]
      operationId: resetPassword
      summary: Reset password
      x-access: PUBLIC
      security: []
      requestBody:
        $ref: "#/components/requestBodies/ResetPassword"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/auth/verify-otp:
    post:
      tags: [01 Authentication]
      operationId: verifyEmailOtp
      summary: Verify email OTP
      x-access: PUBLIC
      description: Verifies the account and sets the HTTP-only authentication cookie.
      security: []
      requestBody:
        $ref: "#/components/requestBodies/VerifyOtp"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/auth/resend-otp:
    post:
      tags: [01 Authentication]
      operationId: resendEmailOtp
      summary: Resend email OTP
      x-access: PUBLIC
      security: []
      requestBody:
        $ref: "#/components/requestBodies/Email"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/users/profile:
    patch:
      tags: [02 Users]
      operationId: updateOwnProfile
      summary: Update own profile
      x-access: AUTHENTICATED
      requestBody:
        $ref: "#/components/requestBodies/UpdateProfile"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/users:
    get:
      tags: [02 Users]
      operationId: listUsers
      summary: List users
      x-access: ADMIN
      description: Requires user-view permission.
      parameters:
        - $ref: "#/components/parameters/RoleFilter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/users/{targetUserId}/promote:
    patch:
      tags: [02 Users]
      operationId: promoteUser
      summary: Promote student to admin
      x-access: SUPER_ADMIN
      description: Super-admin only.
      parameters:
        - $ref: "#/components/parameters/TargetUserId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/users/{targetUserId}/demote:
    patch:
      tags: [02 Users]
      operationId: demoteUser
      summary: Demote admin to student
      x-access: SUPER_ADMIN
      description: Super-admin only. Super admins cannot be demoted through this route.
      parameters:
        - $ref: "#/components/parameters/TargetUserId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/catalog/services:
    get:
      tags: [03 Public Catalog]
      operationId: listPublicLearningServices
      summary: List active learning services
      x-access: PUBLIC
      description: Returns database-configured Active learning services and their inherited access, course, enrollment, and payment policies.
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/catalog/{serviceSlug}/categories:
    get:
      tags: [03 Public Catalog]
      operationId: listPublicCategories
      summary: List published service categories
      x-access: PUBLIC
      security: []
      parameters:
        - $ref: "#/components/parameters/ServiceSlug"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/catalog/{serviceSlug}/categories/{categorySlug}:
    get:
      tags: [03 Public Catalog]
      operationId: getPublicCategory
      summary: Get published category and courses
      x-access: PUBLIC
      security: []
      parameters:
        - $ref: "#/components/parameters/ServiceSlug"
        - $ref: "#/components/parameters/CategorySlug"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/catalog/{serviceSlug}/categories/{categorySlug}/courses/{courseSlug}:
    get:
      tags: [03 Public Catalog]
      operationId: getPublicCourse
      summary: Get published course detail
      x-access: PUBLIC
      security: []
      parameters:
        - $ref: "#/components/parameters/ServiceSlug"
        - $ref: "#/components/parameters/CategorySlug"
        - $ref: "#/components/parameters/CourseSlug"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/categories:
    get:
      tags: [04 Categories]
      operationId: listCategoriesAdmin
      summary: List categories for administration
      x-access: ADMIN
      parameters:
        - $ref: "#/components/parameters/ServiceIdFilter"
        - $ref: "#/components/parameters/CatalogStatusFilter"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    post:
      tags: [04 Categories]
      operationId: createCategory
      summary: Create category draft
      x-access: ADMIN
      requestBody:
        $ref: "#/components/requestBodies/CreateCategory"
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /api/v1/categories/{categoryId}:
    get:
      tags: [04 Categories]
      operationId: getCategoryAdmin
      summary: Get category for administration
      x-access: ADMIN
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    patch:
      tags: [04 Categories]
      operationId: updateCategory
      summary: Update category
      x-access: ADMIN
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      requestBody:
        $ref: "#/components/requestBodies/UpdateCategory"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    delete:
      tags: [04 Categories]
      operationId: deleteCategoryPermanently
      summary: "[DESTRUCTIVE] Permanently delete archived category"
      x-access: SUPER_ADMIN
      description: Super-admin only. Deletes only archived catalog setup without course curriculum or learner history.
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "409":
          $ref: "#/components/responses/CatalogDeletionBlocked"

  /api/v1/categories/{categoryId}/deletion-impact:
    get:
      tags: [04 Categories]
      operationId: getCategoryDeletionImpact
      summary: Preview whether permanent category deletion is safe
      x-access: SUPER_ADMIN
      description: Super-admin only. Aggregates child course-intake curriculum and protected learner history without changing data.
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/categories/{categoryId}/publish:
    patch:
      tags: [04 Categories]
      operationId: publishCategory
      summary: Publish category
      x-access: SUPER_ADMIN
      description: Super-admin only.
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/categories/{categoryId}/unpublish:
    patch:
      tags: [04 Categories]
      operationId: unpublishCategory
      summary: Unpublish category
      x-access: SUPER_ADMIN
      description: Super-admin only.
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/categories/{categoryId}/archive:
    patch:
      tags: [04 Categories]
      operationId: archiveCategory
      summary: Archive category and child courses
      x-access: SUPER_ADMIN
      description: Super-admin only. Preserves existing learner records and session content.
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/categories/{categoryId}/unarchive:
    patch:
      tags: [04 Categories]
      operationId: unarchiveCategory
      summary: Restore category as draft
      x-access: SUPER_ADMIN
      description: Super-admin only. Child courses remain archived.
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/course-groups:
    get:
      tags: [05 Course Groups]
      operationId: listCourseGroupsAdmin
      summary: List internal course groups and their intake courses
      x-access: ADMIN
      description: Course groups organize courses that represent the same real-world program and own the immutable certificate policy shared by every intake. They are never exposed by the public catalog.
      parameters:
        - $ref: "#/components/parameters/CategoryIdFilter"
        - $ref: "#/components/parameters/ServiceIdFilter"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    post:
      tags: [05 Course Groups]
      operationId: createCourseGroup
      summary: Create an internal course group
      x-access: ADMIN
      requestBody:
        $ref: "#/components/requestBodies/CreateCourseGroup"
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /api/v1/course-groups/{courseGroupId}:
    get:
      tags: [05 Course Groups]
      operationId: getCourseGroupAdmin
      summary: Get a course group and its intake courses
      x-access: ADMIN
      parameters:
        - $ref: "#/components/parameters/CourseGroupId"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    patch:
      tags: [05 Course Groups]
      operationId: updateCourseGroup
      summary: Update internal course-group setup
      x-access: ADMIN
      description: Course-group identity is editable only before its first course is created. This keeps every intake and historical certificate tied to one stable real-world course identity.
      parameters:
        - $ref: "#/components/parameters/CourseGroupId"
      requestBody:
        $ref: "#/components/requestBodies/UpdateCourseGroup"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    delete:
      tags: [05 Course Groups]
      operationId: deleteCourseGroupPermanently
      summary: "[DESTRUCTIVE] Permanently delete an archived empty course group"
      x-access: SUPER_ADMIN
      parameters:
        - $ref: "#/components/parameters/CourseGroupId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/course-groups/{courseGroupId}/deletion-impact:
    get:
      tags: [05 Course Groups]
      operationId: getCourseGroupDeletionImpact
      summary: Inspect whether a course group can be permanently deleted
      x-access: SUPER_ADMIN
      parameters:
        - $ref: "#/components/parameters/CourseGroupId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/course-groups/{courseGroupId}/archive:
    patch:
      tags: [05 Course Groups]
      operationId: archiveCourseGroup
      summary: Archive an inactive course group
      x-access: SUPER_ADMIN
      description: Open or closed-active intake courses block archival.
      parameters:
        - $ref: "#/components/parameters/CourseGroupId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/course-groups/{courseGroupId}/unarchive:
    patch:
      tags: [05 Course Groups]
      operationId: unarchiveCourseGroup
      summary: Restore an archived course group
      x-access: SUPER_ADMIN
      parameters:
        - $ref: "#/components/parameters/CourseGroupId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/courses:
    get:
      tags: [06 Course Intakes]
      operationId: listCoursesAdmin
      summary: List courses for administration
      x-access: ADMIN
      parameters:
        - $ref: "#/components/parameters/ServiceIdFilter"
        - $ref: "#/components/parameters/CategoryIdFilter"
        - name: status
          in: query
          schema: { type: string, enum: [DRAFT, OPEN_ACTIVE, CLOSED_ACTIVE, COMPLETED, CANCELLED, ARCHIVED] }
        - $ref: "#/components/parameters/CourseLevelFilter"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    post:
      tags: [06 Course Intakes]
      operationId: createCourse
      summary: Create a course intake draft
      x-access: ADMIN
      description: The first intake defines immutable public content. Certificate policy comes from the course group. Later intakes copy a selected existing sibling and its active Ready curriculum into independent course-session rows; learner history is never copied.
      requestBody:
        $ref: "#/components/requestBodies/CreateCourse"
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /api/v1/courses/{courseId}:
    get:
      tags: [06 Course Intakes]
      operationId: getCourseAdmin
      summary: Get course for administration
      x-access: ADMIN
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    patch:
      tags: [06 Course Intakes]
      operationId: updateCourse
      summary: Update intake dates, timezone, or capacity
      x-access: ADMIN
      description: Certificate policy is not editable. It was fixed when the course was created.
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        $ref: "#/components/requestBodies/UpdateCourse"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    delete:
      tags: [06 Course Intakes]
      operationId: deleteCoursePermanently
      summary: "[DESTRUCTIVE] Permanently delete archived course"
      x-access: SUPER_ADMIN
      description: Super-admin only. Deletes only an archived intake without curriculum or learner history.
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "409":
          $ref: "#/components/responses/CatalogDeletionBlocked"

  /api/v1/courses/{courseId}/deletion-impact:
    get:
      tags: [06 Course Intakes]
      operationId: getCourseDeletionImpact
      summary: Preview whether permanent course deletion is safe
      x-access: SUPER_ADMIN
      description: Super-admin only. Aggregates protected curriculum and enrollment history without changing data.
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/courses/{courseId}/status:
    patch:
      tags: [06 Course Intakes]
      operationId: transitionCourseStatus
      summary: Transition the course-intake lifecycle
      x-access: ADMIN
      description: Uses expectedStatus for optimistic concurrency. Opening, closing, and archiving require Super Admin; completion and cancellation are available to authorized administrators. Opening one sibling atomically closes the previous OPEN_ACTIVE sibling.
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        $ref: "#/components/requestBodies/UpdateCourseStatus"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/courses/{courseId}/enroll:
    post:
      tags: [09 Enrollments & Classroom]
      operationId: selfEnrollFreeCourse
      summary: Self-enroll in free course
      x-access: STUDENT
      description: Student-only. Course and parent category must be published, enrollment must be Open, and the Free Learning course must contain at least one active curriculum session. Repeating the request for a live enrollment is idempotent. If the student's direct enrollment was cancelled, the same enrollment is reactivated so its progress and history remain attached; reactivation is intentionally not an admin operation.
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/sessions:
    get:
      tags: [07 Session Library]
      operationId: listSessionLibrary
      summary: List Session Library resources
      x-access: ADMIN
      description: Admin/session-library permission required. Supports lifecycle, search, pagination, and course-attachability filters. Every session is reusable across courses.
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/SessionStatusFilter"
        - $ref: "#/components/parameters/SessionTagFilter"
        - $ref: "#/components/parameters/AttachableCourseIdFilter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    post:
      tags: [07 Session Library]
      operationId: createSession
      summary: Create independent session resource
      x-access: ADMIN
      description: A READY session requires a recording URL. It is not attached to a course by creation alone.
      requestBody:
        $ref: "#/components/requestBodies/CreateSession"
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /api/v1/sessions/bulk-archive:
    post:
      tags: [07 Session Library]
      operationId: bulkArchiveSessions
      summary: Archive multiple Session Library resources
      x-access: ADMIN
      description: Archives up to 100 sessions in one request. Each session is archived independently; a failure on one does not block the others.
      requestBody:
        $ref: "#/components/requestBodies/BulkArchiveSessions"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/sessions/{sessionId}:
    get:
      tags: [07 Session Library]
      operationId: getSession
      summary: Get Session Library detail and usage impact
      x-access: ADMIN
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    patch:
      tags: [07 Session Library]
      operationId: updateSession
      summary: Update session resource
      x-access: ADMIN
      description: Archived resources are read-only. Shared updates affect every attached course intake.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        $ref: "#/components/requestBodies/UpdateSession"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    delete:
      tags: [07 Session Library]
      operationId: deleteSession
      summary: "[DESTRUCTIVE] Permanently delete unused session"
      x-access: SUPER_ADMIN
      description: Super-admin only. The session must be archived and have no curriculum or delivery references.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/sessions/{sessionId}/archive:
    patch:
      tags: [07 Session Library]
      operationId: archiveSession
      summary: Archive session resource
      x-access: ADMIN
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/sessions/{sessionId}/unarchive:
    patch:
      tags: [07 Session Library]
      operationId: unarchiveSession
      summary: Restore archived session as draft
      x-access: ADMIN
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/sessions/{sessionId}/duplicate:
    post:
      tags: [07 Session Library]
      operationId: duplicateSession
      summary: Duplicate a session resource as a new draft
      x-access: ADMIN
      description: Copies content fields (title suffixed "(Copy)", description, URLs, duration, tags) into a brand-new session. Never copies course usage, delivery state, or completion history. The copy always starts DRAFT regardless of the source's status.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /api/v1/courses/{courseId}/curriculum:
    get:
      tags: [08 Course Curriculum & Delivery]
      operationId: listCourseCurriculum
      summary: List course curriculum
      x-access: ADMIN
      description: Set includeRetired to show history-preserved curriculum relationships that were already delivered or completed.
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - name: includeRetired
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          $ref: "#/components/responses/Success"
    post:
      tags: [08 Course Curriculum & Delivery]
      operationId: attachCourseSession
      summary: Attach an existing Ready library session
      x-access: ADMIN
      description: Inline session creation is intentionally unavailable; create resources in the Session Library first.
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        $ref: "#/components/requestBodies/AttachCourseSession"
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /api/v1/courses/{courseId}/curriculum/reorder:
    patch:
      tags: [08 Course Curriculum & Delivery]
      operationId: reorderCourseCurriculum
      summary: Reorder active course curriculum
      x-access: ADMIN
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        $ref: "#/components/requestBodies/ReorderCourseCurriculum"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "409":
          $ref: "#/components/responses/SequenceRisk"

  /api/v1/courses/{courseId}/curriculum/{courseSessionId}:
    delete:
      tags: [08 Course Curriculum & Delivery]
      operationId: removeCourseSession
      summary: Detach unused or retire delivered curriculum session
      x-access: ADMIN
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/CourseSessionId"
      requestBody:
        $ref: "#/components/requestBodies/UpdateCourseSessionDelivery"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/courses/{courseId}/curriculum/{courseSessionId}/delivery:
    patch:
      tags: [08 Course Curriculum & Delivery]
      operationId: updateCourseSessionDelivery
      summary: Release, schedule, withdraw, or reset a course session
      x-access: ADMIN
      description: Delivery belongs directly to the intake course. Unsafe sequencing returns 409 until explicitly acknowledged.
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/CourseSessionId"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "409":
          $ref: "#/components/responses/SequenceRisk"

  /api/v1/enrollments/my:
    get:
      tags: [09 Enrollments & Classroom]
      operationId: listOwnEnrollments
      summary: List own enrollments
      x-access: AUTHENTICATED
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/enrollments/{enrollmentId}/progress:
    get:
      tags: [09 Enrollments & Classroom]
      operationId: getEnrollmentProgress
      summary: Get enrollment progress
      x-access: AUTHENTICATED
      description: Available to the enrollment owner or an admin.
      parameters:
        - $ref: "#/components/parameters/EnrollmentId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/enrollments/{enrollmentId}/classroom:
    get:
      tags: [09 Enrollments & Classroom]
      operationId: getEnrollmentClassroom
      summary: Get delivery-specific classroom
      x-access: AUTHENTICATED
      description: Owner or admin. Paid access requires completed payment; all classrooms resolve released or mature scheduled sessions directly from the enrolled course intake.
      parameters:
        - $ref: "#/components/parameters/EnrollmentId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/enrollments/{enrollmentId}/sessions/{courseSessionId}:
    get:
      tags: [09 Enrollments & Classroom]
      operationId: getClassroomSession
      summary: Get one accessible classroom session
      x-access: AUTHENTICATED
      parameters:
        - $ref: "#/components/parameters/EnrollmentId"
        - $ref: "#/components/parameters/CourseSessionId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/enrollments/{enrollmentId}/sessions/{courseSessionId}/complete:
    post:
      tags: [09 Enrollments & Classroom]
      operationId: completeClassroomSession
      summary: Mark accessible session complete
      x-access: STUDENT
      description: Enrollment owner only. Completion may change only while the enrollment is Active; a Completed enrollment remains readable but its learning history is frozen.
      parameters:
        - $ref: "#/components/parameters/EnrollmentId"
        - $ref: "#/components/parameters/CourseSessionId"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "200":
          $ref: "#/components/responses/Success"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      tags: [09 Enrollments & Classroom]
      operationId: uncompleteClassroomSession
      summary: Remove accessible session completion
      x-access: STUDENT
      description: Enrollment owner only. Completion may change only while the enrollment is Active; a Completed enrollment returns ENROLLMENT_COMPLETED and preserves its history.
      parameters:
        - $ref: "#/components/parameters/EnrollmentId"
        - $ref: "#/components/parameters/CourseSessionId"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/enrollments/{enrollmentId}:
    patch:
      tags: [09 Enrollments & Classroom]
      operationId: updateEnrollment
      summary: Update enrollment or payment status
      x-access: ADMIN
      description: Admin/enrollment-management permission required. Active may move to Completed or Cancelled. Cancelled paid/admin enrollment may return to Active; cancelled self-enrollment is reactivated only by its student enrollment endpoint. Completed is terminal and cannot be reopened or cancelled through this operation. Status writes are serialized with student completion mutations.
      parameters:
        - $ref: "#/components/parameters/EnrollmentId"
      requestBody:
        $ref: "#/components/requestBodies/UpdateEnrollment"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/courses/{courseId}/eligible-students:
    get:
      tags: [09 Enrollments & Classroom]
      operationId: listCourseEligibleStudents
      summary: Search verified students eligible for this paid course intake
      x-access: ADMIN
      description: Returns a stable email-and-ID keyset page. Pass the opaque nextCursor from one response as cursor to request the next page; changing q starts a new search.
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/EligibleLimit"
        - $ref: "#/components/parameters/EligibleCursor"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/courses/{courseId}/enrollments:
    get:
      tags: [09 Enrollments & Classroom]
      operationId: listCourseRoster
      summary: List the course-intake roster and payment evidence
      x-access: ADMIN
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/EnrollmentStatusFilter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    post:
      tags: [09 Enrollments & Classroom]
      operationId: manuallyEnrollStudent
      summary: Manually enroll a verified student in an open paid course intake
      x-access: ADMIN
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        $ref: "#/components/requestBodies/CreatePaidEnrollment"
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /api/v1/courses/{courseId}/enrollments/bulk:
    post:
      tags: [09 Enrollments & Classroom]
      operationId: bulkEnrollStudents
      summary: Process course-intake enrollment for multiple students
      x-access: ADMIN
      description: >-
        Returns ordered per-student CREATED or FAILED results. Writes are
        serialized behind the course-enrollment lock so capacity and duplicate
        decisions remain concurrency-safe. Once a locked transaction proves
        capacity is exhausted, the remaining eligible rows receive
        COURSE_CAPACITY_REACHED without opening additional insert transactions.
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        $ref: "#/components/requestBodies/BulkPaidEnrollment"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/enrollments/{enrollmentId}/certificate:
    post:
      tags: [10 Certificates]
      operationId: issueCertificate
      summary: Issue certificate
      x-access: ADMIN
      description: >-
        Admin-only. Enrollment must be completed and the course must have
        certificates enabled. Random certificate-code collisions are retried
        up to five times; a competing certificate for the same enrollment is
        not treated as a retryable code collision.
      parameters:
        - $ref: "#/components/parameters/EnrollmentId"
      requestBody:
        $ref: "#/components/requestBodies/IssueCertificate"
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /api/v1/certificates/verify/{certificateCode}:
    get:
      tags: [10 Certificates]
      operationId: verifyCertificate
      summary: Verify certificate publicly
      x-access: PUBLIC
      security: []
      parameters:
        - $ref: "#/components/parameters/CertificateCode"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/certificates/my:
    get:
      tags: [10 Certificates]
      operationId: listOwnCertificates
      summary: List own certificates
      x-access: AUTHENTICATED
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/certificates/admin:
    get:
      tags: [10 Certificates]
      operationId: listCertificatesAdmin
      summary: List all certificates for administration
      x-access: ADMIN
      description: Admin/certificate-management permission required. Returns a bounded keyset page.
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/CertificateStatusFilter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/certificates/{certificateId}:
    get:
      tags: [10 Certificates]
      operationId: getCertificate
      summary: Get certificate detail
      x-access: AUTHENTICATED
      description: Available to the certificate owner or an admin.
      parameters:
        - $ref: "#/components/parameters/CertificateId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/certificates/{certificateId}/revoke:
    patch:
      tags: [10 Certificates]
      operationId: revokeCertificate
      summary: Revoke certificate
      x-access: ADMIN
      description: >-
        Admin/certificate-management permission required. Revocation locks the
        enrollment, rereads the certificate and its course/catalog lifecycle in
        one transaction, and rejects a repeated revocation. A credential may
        still be revoked after its course or catalog parents become terminal or
        archived because invalid credentials must remain revocable.
      parameters:
        - $ref: "#/components/parameters/CertificateId"
      requestBody:
        $ref: "#/components/requestBodies/RevokeCertificate"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/projects/showcase:
    get:
      tags: [11 Projects]
      operationId: listPublicProjects
      summary: List public approved projects
      x-access: PUBLIC
      security: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/projects/showcase/{projectId}:
    get:
      tags: [11 Projects]
      operationId: getPublicProject
      summary: Get public approved project
      x-access: PUBLIC
      security: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/projects:
    post:
      tags: [11 Projects]
      operationId: submitProject
      summary: Submit project
      x-access: STUDENT
      description: Enrollment must belong to the current user and must not be cancelled.
      requestBody:
        $ref: "#/components/requestBodies/CreateProject"
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /api/v1/projects/my:
    get:
      tags: [11 Projects]
      operationId: listOwnProjects
      summary: List own projects
      x-access: AUTHENTICATED
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/projects/{projectId}:
    get:
      tags: [11 Projects]
      operationId: getProject
      summary: Get project detail
      x-access: AUTHENTICATED
      description: Available only to the project owner or an administrator. Public approved projects use the separately projected showcase endpoint.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    patch:
      tags: [11 Projects]
      operationId: updateProject
      summary: Update pending project
      x-access: STUDENT
      description: The current user must own the project and it must still be pending.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        $ref: "#/components/requestBodies/UpdateProject"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/projects/admin/all:
    get:
      tags: [11 Projects]
      operationId: listProjectsAdmin
      summary: List all projects for review
      x-access: ADMIN
      description: Admin/project-review permission required.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/projects/{projectId}/review:
    patch:
      tags: [11 Projects]
      operationId: reviewProject
      summary: Review project
      x-access: ADMIN
      description: Admin/project-review permission required.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        $ref: "#/components/requestBodies/ReviewProject"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/audit/logs:
    get:
      tags: [12 Audit Logs]
      operationId: listAuditLogs
      summary: Search audit logs
      x-access: SUPER_ADMIN
      description: Super-admin only.
      parameters:
        - name: action
          in: query
          schema: { type: string }
          example: COURSE_PUBLISHED
        - name: resourceType
          in: query
          schema: { type: string }
          example: COURSE
        - name: actorUserId
          in: query
          schema: { type: string, format: uuid }
          example: "{{currentUserId}}"
        - name: entityId
          in: query
          schema: { type: string }
          example: "{{courseId}}"
        - name: from
          in: query
          schema: { type: string, format: date-time }
          example: "2026-08-01T00:00:00.000Z"
        - name: to
          in: query
          schema: { type: string, format: date-time }
          example: "2026-08-31T23:59:59.999Z"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          $ref: "#/components/responses/Success"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: Set automatically by Login or Verify email OTP.

  responses:
    Success:
      description: Successful API response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SuccessEnvelope"
    Created:
      description: Resource created successfully
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SuccessEnvelope"
    Error:
      description: Standard API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    SequenceRisk:
      description: Explicit confirmation is required because the operation breaks curriculum sequence.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SequenceRiskEnvelope"
    CatalogDeletionBlocked:
      description: Permanent deletion would destroy operational delivery or protected learner history.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CatalogDeletionBlockedEnvelope"

  parameters:
    TargetUserId:
      name: targetUserId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: "{{targetUserId}}"
    ServiceSlug:
      name: serviceSlug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      example: "{{serviceSlug}}"
    LearningServiceId:
      name: learningServiceId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: "{{learningServiceId}}"
    CategorySlug:
      name: categorySlug
      in: path
      required: true
      schema: { type: string }
      example: "{{categorySlug}}"
    CourseSlug:
      name: courseSlug
      in: path
      required: true
      schema: { type: string }
      example: "{{courseSlug}}"
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: "{{categoryId}}"
    CourseId:
      name: courseId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: "{{courseId}}"
    CourseGroupId:
      name: courseGroupId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: "{{courseGroupId}}"
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: "{{sessionId}}"
    CourseSessionId:
      name: courseSessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: "{{courseSessionId}}"
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: "{{enrollmentId}}"
    CertificateId:
      name: certificateId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: "{{certificateId}}"
    CertificateCode:
      name: certificateCode
      in: path
      required: true
      schema: { type: string, minLength: 20, maxLength: 64 }
      example: "{{certificateCode}}"
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: "{{projectId}}"
    RoleFilter:
      name: role
      in: query
      schema:
        $ref: "#/components/schemas/Role"
      example: STUDENT
    ServiceIdFilter:
      name: serviceId
      in: query
      schema: { type: string, format: uuid }
      example: "{{learningServiceId}}"
    LearningServiceStatusFilter:
      name: status
      in: query
      schema:
        $ref: "#/components/schemas/LearningServiceStatus"
      example: ACTIVE
    IncludeArchived:
      name: includeArchived
      in: query
      schema: { type: boolean, default: true }
    CategoryIdFilter:
      name: categoryId
      in: query
      schema: { type: string, format: uuid }
      example: "{{categoryId}}"
    CatalogStatusFilter:
      name: status
      in: query
      schema:
        $ref: "#/components/schemas/CatalogStatus"
      example: DRAFT
    CourseLevelFilter:
      name: level
      in: query
      schema:
        $ref: "#/components/schemas/CourseLevel"
      example: BEGINNER
    AccessTypeFilter:
      name: accessType
      in: query
      schema:
        $ref: "#/components/schemas/CourseAccessType"
      example: FREE
    SearchQuery:
      name: q
      in: query
      schema: { type: string }
      example: ai
    SessionStatusFilter:
      name: status
      in: query
      schema:
        $ref: "#/components/schemas/SessionStatus"
      example: READY
    AttachableCourseIdFilter:
      name: attachableCourseId
      in: query
      description: Return Ready library sessions with no active or retired relationship to this course. Retired relationships are restored from curriculum history instead of the picker.
      schema: { type: string, format: uuid }
      example: "{{courseId}}"
    SessionTagFilter:
      name: tag
      in: query
      description: Return sessions with a tag containing this text (case-insensitive partial match).
      schema: { type: string, maxLength: 40 }
      example: jav
    EnrollmentStatusFilter:
      name: status
      in: query
      schema:
        $ref: "#/components/schemas/EnrollmentStatus"
      example: ACTIVE
    CertificateStatusFilter:
      name: status
      in: query
      schema:
        $ref: "#/components/schemas/CertificateStatus"
      example: ISSUED
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque next-page cursor returned by the preceding response. It is valid only with the same resource scope and filters.
      schema: { type: string, maxLength: 1024 }
    EligibleLimit:
      name: limit
      in: query
      description: Page size. Use cursor for additional pages instead of increasing the limit.
      schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
    EligibleCursor:
      name: cursor
      in: query
      description: Opaque next-page cursor returned by the preceding eligible-student response. It is valid only with the same course and search query.
      schema: { type: string, maxLength: 512 }
      example: "{{eligibleStudentsCursor}}"
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }

  requestBodies:
    Register:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RegisterInput"
