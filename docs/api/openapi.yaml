openapi: 3.0.3
info:
  title: Foundry Academy LMS API
  version: 1.0.0
  description: |
    Canonical API contract for the Foundry Academy LMS.

    Authentication uses the HTTP-only `token` cookie. In Postman, run Login or
    Verify email OTP first and allow Postman's cookie jar to retain the cookie.
    Admin and super-admin requests require an account with the matching backend
    permission.
servers:
  - url: "{baseUrl}"
    description: Selected Foundry LMS API server
    variables:
      baseUrl:
        default: http://localhost:5000
tags:
  - name: 00 System
  - name: 01 Authentication
  - name: 02 Users
  - name: 03 Public Catalog
  - name: 04 Categories
  - name: 05 Courses
  - name: 06 Session Library
  - name: 07 Course Curriculum
  - name: 08 Batches & Delivery
  - name: 09 Enrollments & Classroom
  - name: 10 Certificates
  - name: 11 Projects
  - name: 12 Audit Logs
  - name: 13 Service Overview
security:
  - cookieAuth: []
paths:
  /api/health:
    get:
      tags: [00 System]
      operationId: getHealth
      summary: Check API health
      x-access: PUBLIC
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/services/summary:
    get:
      tags: [13 Service Overview]
      operationId: getAdminLearningServiceSummaries
      summary: Get learning-service administration summaries
      x-access: ADMIN
      description: Returns the three fixed learning services with catalog, learner, curriculum, batch, payment-attention, and lifecycle aggregates. Zero-count services are always included.
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/postman/collection:
    get:
      tags: [00 System]
      operationId: downloadPostmanCollection
      summary: Download latest Postman collection
      x-access: PUBLIC
      description: Returns the raw generated collection for direct URL import into Postman.
      security: []
      responses:
        "200":
          description: Postman Collection v2.1 JSON
          content:
            application/json:
              schema: { type: object }

  /api/postman/environment:
    get:
      tags: [00 System]
      operationId: downloadPostmanEnvironment
      summary: Download safe Postman environment
      x-access: PUBLIC
      description: Returns the raw local environment with blank credentials and destructive requests disabled.
      security: []
      responses:
        "200":
          description: Postman environment JSON
          content:
            application/json:
              schema: { type: object }

  /api/v1/auth/register:
    post:
      tags: [01 Authentication]
      operationId: registerStudent
      summary: Register student
      x-access: PUBLIC
      security: []
      requestBody:
        $ref: "#/components/requestBodies/Register"
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /api/v1/auth/login:
    post:
      tags: [01 Authentication]
      operationId: login
      summary: Login
      x-access: PUBLIC
      description: Sets the HTTP-only authentication cookie used by protected requests.
      security: []
      requestBody:
        $ref: "#/components/requestBodies/Login"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/auth/logout:
    post:
      tags: [01 Authentication]
      operationId: logout
      summary: Logout
      x-access: PUBLIC
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/auth/me:
    get:
      tags: [01 Authentication]
      operationId: getCurrentUser
      summary: Get current user
      x-access: AUTHENTICATED
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/auth/forgot-password:
    post:
      tags: [01 Authentication]
      operationId: forgotPassword
      summary: Request password reset
      x-access: PUBLIC
      security: []
      requestBody:
        $ref: "#/components/requestBodies/Email"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/auth/reset-password:
    post:
      tags: [01 Authentication]
      operationId: resetPassword
      summary: Reset password
      x-access: PUBLIC
      security: []
      requestBody:
        $ref: "#/components/requestBodies/ResetPassword"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/auth/verify-otp:
    post:
      tags: [01 Authentication]
      operationId: verifyEmailOtp
      summary: Verify email OTP
      x-access: PUBLIC
      description: Verifies the account and sets the HTTP-only authentication cookie.
      security: []
      requestBody:
        $ref: "#/components/requestBodies/VerifyOtp"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/auth/resend-otp:
    post:
      tags: [01 Authentication]
      operationId: resendEmailOtp
      summary: Resend email OTP
      x-access: PUBLIC
      security: []
      requestBody:
        $ref: "#/components/requestBodies/Email"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/users/profile:
    patch:
      tags: [02 Users]
      operationId: updateOwnProfile
      summary: Update own profile
      x-access: AUTHENTICATED
      requestBody:
        $ref: "#/components/requestBodies/UpdateProfile"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/users:
    get:
      tags: [02 Users]
      operationId: listUsers
      summary: List users
      x-access: ADMIN
      description: Requires user-view permission.
      parameters:
        - $ref: "#/components/parameters/RoleFilter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/users/{targetUserId}/promote:
    patch:
      tags: [02 Users]
      operationId: promoteUser
      summary: Promote student to admin
      x-access: SUPER_ADMIN
      description: Super-admin only.
      parameters:
        - $ref: "#/components/parameters/TargetUserId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/users/{targetUserId}/demote:
    patch:
      tags: [02 Users]
      operationId: demoteUser
      summary: Demote admin to student
      x-access: SUPER_ADMIN
      description: Super-admin only. Super admins cannot be demoted through this route.
      parameters:
        - $ref: "#/components/parameters/TargetUserId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/catalog/{serviceSlug}/categories:
    get:
      tags: [03 Public Catalog]
      operationId: listPublicCategories
      summary: List published service categories
      x-access: PUBLIC
      security: []
      parameters:
        - $ref: "#/components/parameters/ServiceSlug"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/catalog/{serviceSlug}/categories/{categorySlug}:
    get:
      tags: [03 Public Catalog]
      operationId: getPublicCategory
      summary: Get published category and courses
      x-access: PUBLIC
      security: []
      parameters:
        - $ref: "#/components/parameters/ServiceSlug"
        - $ref: "#/components/parameters/CategorySlug"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/catalog/{serviceSlug}/categories/{categorySlug}/courses/{courseSlug}:
    get:
      tags: [03 Public Catalog]
      operationId: getPublicCourse
      summary: Get published course detail
      x-access: PUBLIC
      security: []
      parameters:
        - $ref: "#/components/parameters/ServiceSlug"
        - $ref: "#/components/parameters/CategorySlug"
        - $ref: "#/components/parameters/CourseSlug"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/categories:
    get:
      tags: [04 Categories]
      operationId: listCategoriesAdmin
      summary: List categories for administration
      x-access: ADMIN
      parameters:
        - $ref: "#/components/parameters/ServiceTypeFilter"
        - $ref: "#/components/parameters/CatalogStatusFilter"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    post:
      tags: [04 Categories]
      operationId: createCategory
      summary: Create category draft
      x-access: ADMIN
      requestBody:
        $ref: "#/components/requestBodies/CreateCategory"
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /api/v1/categories/{categoryId}:
    get:
      tags: [04 Categories]
      operationId: getCategoryAdmin
      summary: Get category for administration
      x-access: ADMIN
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    patch:
      tags: [04 Categories]
      operationId: updateCategory
      summary: Update category
      x-access: ADMIN
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      requestBody:
        $ref: "#/components/requestBodies/UpdateCategory"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    delete:
      tags: [04 Categories]
      operationId: deleteCategoryPermanently
      summary: "[DESTRUCTIVE] Permanently delete archived category"
      x-access: SUPER_ADMIN
      description: Super-admin only. Deletes only unused archived catalog setup. Enrolling/active batches and any enrollment, completion, certificate, or project history block deletion.
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "409":
          $ref: "#/components/responses/CatalogDeletionBlocked"

  /api/v1/categories/{categoryId}/deletion-impact:
    get:
      tags: [04 Categories]
      operationId: getCategoryDeletionImpact
      summary: Preview whether permanent category deletion is safe
      x-access: SUPER_ADMIN
      description: Super-admin only. Aggregates all child-course operational batches and protected learner history without changing data.
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/categories/{categoryId}/publish:
    patch:
      tags: [04 Categories]
      operationId: publishCategory
      summary: Publish category
      x-access: SUPER_ADMIN
      description: Super-admin only.
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/categories/{categoryId}/unpublish:
    patch:
      tags: [04 Categories]
      operationId: unpublishCategory
      summary: Unpublish category
      x-access: SUPER_ADMIN
      description: Super-admin only.
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/categories/{categoryId}/archive:
    patch:
      tags: [04 Categories]
      operationId: archiveCategory
      summary: Archive category and child courses
      x-access: SUPER_ADMIN
      description: Super-admin only. Preserves existing learner records and session content.
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/categories/{categoryId}/unarchive:
    patch:
      tags: [04 Categories]
      operationId: unarchiveCategory
      summary: Restore category as draft
      x-access: SUPER_ADMIN
      description: Super-admin only. Child courses remain archived.
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/courses:
    get:
      tags: [05 Courses]
      operationId: listCoursesAdmin
      summary: List courses for administration
      x-access: ADMIN
      parameters:
        - $ref: "#/components/parameters/ServiceTypeFilter"
        - $ref: "#/components/parameters/CategoryIdFilter"
        - $ref: "#/components/parameters/CatalogStatusFilter"
        - $ref: "#/components/parameters/CourseLevelFilter"
        - $ref: "#/components/parameters/AccessTypeFilter"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    post:
      tags: [05 Courses]
      operationId: createCourse
      summary: Create course draft
      x-access: ADMIN
      description: Certificate policy must be selected explicitly at creation and is immutable afterward. It applies to every batch of the course.
      requestBody:
        $ref: "#/components/requestBodies/CreateCourse"
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /api/v1/courses/{courseId}:
    get:
      tags: [05 Courses]
      operationId: getCourseAdmin
      summary: Get course for administration
      x-access: ADMIN
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    patch:
      tags: [05 Courses]
      operationId: updateCourse
      summary: Update course
      x-access: ADMIN
      description: Certificate policy is not editable. It was fixed when the course was created.
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        $ref: "#/components/requestBodies/UpdateCourse"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    delete:
      tags: [05 Courses]
      operationId: deleteCoursePermanently
      summary: "[DESTRUCTIVE] Permanently delete archived course"
      x-access: SUPER_ADMIN
      description: Super-admin only. Deletes only unused archived catalog setup. Enrolling/active batches and any enrollment, completion, certificate, or project history block deletion.
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "409":
          $ref: "#/components/responses/CatalogDeletionBlocked"

  /api/v1/courses/{courseId}/deletion-impact:
    get:
      tags: [05 Courses]
      operationId: getCourseDeletionImpact
      summary: Preview whether permanent course deletion is safe
      x-access: SUPER_ADMIN
      description: Super-admin only. Aggregates operational batches and protected learner history without changing data.
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/courses/{courseId}/enrollment-status:
    patch:
      tags: [05 Courses]
      operationId: setCourseEnrollmentStatus
      summary: Set Free Learning enrollment availability
      x-access: SUPER_ADMIN
      description: Super-admin only. Coming soon and Closed block new self-enrollments. Open requires at least one active curriculum session. Publication remains an independent public-visibility lifecycle.
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        $ref: "#/components/requestBodies/SetCourseEnrollmentStatus"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/courses/{courseId}/publish:
    patch:
      tags: [05 Courses]
      operationId: publishCourse
      summary: Publish course
      x-access: SUPER_ADMIN
      description: Super-admin only. Parent category must already be published.
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/courses/{courseId}/unpublish:
    patch:
      tags: [05 Courses]
      operationId: unpublishCourse
      summary: Unpublish course
      x-access: SUPER_ADMIN
      description: Super-admin only.
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/courses/{courseId}/archive:
    patch:
      tags: [05 Courses]
      operationId: archiveCourse
      summary: Archive course
      x-access: SUPER_ADMIN
      description: Super-admin only. Existing learner access is preserved.
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/courses/{courseId}/unarchive:
    patch:
      tags: [05 Courses]
      operationId: unarchiveCourse
      summary: Restore course as draft
      x-access: SUPER_ADMIN
      description: Super-admin only. Parent category must not be archived.
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/courses/{courseId}/enroll:
    post:
      tags: [09 Enrollments & Classroom]
      operationId: selfEnrollFreeCourse
      summary: Self-enroll in free course
      x-access: STUDENT
      description: Student-only. Course and parent category must be published, enrollment must be Open, and the Free Learning course must contain at least one active curriculum session. Repeating the request for a live enrollment is idempotent. If the student's direct enrollment was cancelled, the same enrollment is reactivated so its progress and history remain attached; reactivation is intentionally not an admin operation.
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/sessions:
    get:
      tags: [06 Session Library]
      operationId: listSessionLibrary
      summary: List Session Library resources
      x-access: ADMIN
      description: Admin/session-library permission required. Supports lifecycle, reuse, search, pagination, and course-attachability filters.
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/SessionStatusFilter"
        - $ref: "#/components/parameters/SessionReusePolicyFilter"
        - $ref: "#/components/parameters/AttachableCourseIdFilter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    post:
      tags: [06 Session Library]
      operationId: createSession
      summary: Create independent session resource
      x-access: ADMIN
      description: A READY session requires a recording URL. It is not attached to a course by creation alone.
      requestBody:
        $ref: "#/components/requestBodies/CreateSession"
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /api/v1/sessions/{sessionId}:
    get:
      tags: [06 Session Library]
      operationId: getSession
      summary: Get Session Library detail and usage impact
      x-access: ADMIN
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    patch:
      tags: [06 Session Library]
      operationId: updateSession
      summary: Update session resource
      x-access: ADMIN
      description: Archived resources are read-only. Shared updates affect every attached course and batch.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        $ref: "#/components/requestBodies/UpdateSession"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    delete:
      tags: [06 Session Library]
      operationId: deleteSession
      summary: "[DESTRUCTIVE] Permanently delete unused session"
      x-access: SUPER_ADMIN
      description: Super-admin only. The session must be archived and have no curriculum or delivery references.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/sessions/{sessionId}/archive:
    patch:
      tags: [06 Session Library]
      operationId: archiveSession
      summary: Archive session resource
      x-access: ADMIN
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/sessions/{sessionId}/unarchive:
    patch:
      tags: [06 Session Library]
      operationId: unarchiveSession
      summary: Restore archived session as draft
      x-access: ADMIN
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/courses/{courseId}/curriculum:
    get:
      tags: [07 Course Curriculum]
      operationId: listCourseCurriculum
      summary: List course curriculum
      x-access: ADMIN
      description: Set includeRetired to show history-preserved curriculum relationships and the batches that still reference them.
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - name: includeRetired
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          $ref: "#/components/responses/Success"
    post:
      tags: [07 Course Curriculum]
      operationId: attachCourseSession
      summary: Attach existing or create-and-attach session
      x-access: ADMIN
      description: Enforces one-course/reusable policy transactionally.
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        $ref: "#/components/requestBodies/AttachCourseSession"
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /api/v1/courses/{courseId}/curriculum/reorder:
    patch:
      tags: [07 Course Curriculum]
      operationId: reorderCourseCurriculum
      summary: Reorder active course curriculum
      x-access: ADMIN
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        $ref: "#/components/requestBodies/ReorderCourseCurriculum"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "409":
          $ref: "#/components/responses/SequenceRisk"

  /api/v1/courses/{courseId}/curriculum/{courseSessionId}:
    delete:
      tags: [07 Course Curriculum]
      operationId: removeCourseSession
      summary: Detach unused or retire delivered curriculum session
      x-access: ADMIN
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/CourseSessionId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/courses/{courseId}/batches:
    get:
      tags: [08 Batches & Delivery]
      operationId: listCourseBatches
      summary: List paid course batches
      x-access: ADMIN
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/BatchStatusFilter"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    post:
      tags: [08 Batches & Delivery]
      operationId: createBatch
      summary: Create paid course batch
      x-access: ADMIN
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        $ref: "#/components/requestBodies/CreateBatch"
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /api/v1/batches/{batchId}:
    get:
      tags: [08 Batches & Delivery]
      operationId: getBatch
      summary: Get batch detail
      x-access: ADMIN
      parameters:
        - $ref: "#/components/parameters/BatchId"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    patch:
      tags: [08 Batches & Delivery]
      operationId: updateBatch
      summary: Update batch setup
      x-access: ADMIN
      parameters:
        - $ref: "#/components/parameters/BatchId"
      requestBody:
        $ref: "#/components/requestBodies/UpdateBatch"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/batches/{batchId}/status:
    patch:
      tags: [08 Batches & Delivery]
      operationId: updateBatchStatus
      summary: Transition batch lifecycle status
      x-access: ADMIN
      description: Completing a batch requires released/available curriculum and every non-cancelled enrollment completed. Certificates are additionally required only when the immutable course policy enables them; otherwise certificate readiness is not applicable.
      parameters:
        - $ref: "#/components/parameters/BatchId"
      requestBody:
        $ref: "#/components/requestBodies/UpdateBatchStatus"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/batches/{batchId}/sessions:
    get:
      tags: [08 Batches & Delivery]
      operationId: listBatchSessions
      summary: List effective live curriculum and batch delivery states
      x-access: ADMIN
      description: Live batches inherit active course membership and order. Missing delivery overrides are returned as Unreleased, not omitted.
      parameters:
        - $ref: "#/components/parameters/BatchId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/batches/{batchId}/sessions/{courseSessionId}/delivery:
    patch:
      tags: [08 Batches & Delivery]
      operationId: updateBatchSessionDelivery
      summary: Release, schedule, or withdraw an inherited batch session
      x-access: ADMIN
      description: Cannot change membership or order. Unsafe sequencing returns 409 until explicitly acknowledged.
      parameters:
        - $ref: "#/components/parameters/BatchId"
        - $ref: "#/components/parameters/CourseSessionId"
      requestBody:
        $ref: "#/components/requestBodies/UpdateBatchSessionDelivery"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "409":
          $ref: "#/components/responses/SequenceRisk"

  /api/v1/enrollments/my:
    get:
      tags: [09 Enrollments & Classroom]
      operationId: listOwnEnrollments
      summary: List own enrollments
      x-access: AUTHENTICATED
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/enrollments/{enrollmentId}/progress:
    get:
      tags: [09 Enrollments & Classroom]
      operationId: getEnrollmentProgress
      summary: Get enrollment progress
      x-access: AUTHENTICATED
      description: Available to the enrollment owner or an admin.
      parameters:
        - $ref: "#/components/parameters/EnrollmentId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/enrollments/{enrollmentId}/classroom:
    get:
      tags: [09 Enrollments & Classroom]
      operationId: getEnrollmentClassroom
      summary: Get delivery-specific classroom
      x-access: AUTHENTICATED
      description: Owner or admin. Paid access requires completed payment and resolves released batch sessions; Free Learning resolves active curriculum.
      parameters:
        - $ref: "#/components/parameters/EnrollmentId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/enrollments/{enrollmentId}/sessions/{courseSessionId}:
    get:
      tags: [09 Enrollments & Classroom]
      operationId: getClassroomSession
      summary: Get one accessible classroom session
      x-access: AUTHENTICATED
      parameters:
        - $ref: "#/components/parameters/EnrollmentId"
        - $ref: "#/components/parameters/CourseSessionId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/enrollments/{enrollmentId}/sessions/{courseSessionId}/complete:
    post:
      tags: [09 Enrollments & Classroom]
      operationId: completeClassroomSession
      summary: Mark accessible session complete
      x-access: STUDENT
      description: Enrollment owner only. Completion may change only while the enrollment is Active; a Completed enrollment remains readable but its learning history is frozen.
      parameters:
        - $ref: "#/components/parameters/EnrollmentId"
        - $ref: "#/components/parameters/CourseSessionId"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "200":
          $ref: "#/components/responses/Success"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      tags: [09 Enrollments & Classroom]
      operationId: uncompleteClassroomSession
      summary: Remove accessible session completion
      x-access: STUDENT
      description: Enrollment owner only. Completion may change only while the enrollment is Active; a Completed enrollment returns ENROLLMENT_COMPLETED and preserves its history.
      parameters:
        - $ref: "#/components/parameters/EnrollmentId"
        - $ref: "#/components/parameters/CourseSessionId"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/enrollments/{enrollmentId}:
    patch:
      tags: [09 Enrollments & Classroom]
      operationId: updateEnrollment
      summary: Update enrollment or payment status
      x-access: ADMIN
      description: Admin/enrollment-management permission required. Active may move to Completed or Cancelled. Cancelled paid/admin enrollment may return to Active; cancelled self-enrollment is reactivated only by its student enrollment endpoint. Completed is terminal and cannot be reopened or cancelled through this operation. Status writes are serialized with student completion mutations.
      parameters:
        - $ref: "#/components/parameters/EnrollmentId"
      requestBody:
        $ref: "#/components/requestBodies/UpdateEnrollment"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/batches/{batchId}/eligible-students:
    get:
      tags: [09 Enrollments & Classroom]
      operationId: listBatchEligibleStudents
      summary: Search verified students eligible for this batch
      x-access: ADMIN
      description: Returns a stable email-and-ID keyset page. Pass the opaque nextCursor from one response as cursor to request the next page; changing q starts a new search.
      parameters:
        - $ref: "#/components/parameters/BatchId"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/EligibleLimit"
        - $ref: "#/components/parameters/EligibleCursor"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/batches/{batchId}/enrollments:
    get:
      tags: [09 Enrollments & Classroom]
      operationId: listBatchRoster
      summary: List batch roster and payment evidence
      x-access: ADMIN
      parameters:
        - $ref: "#/components/parameters/BatchId"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/EnrollmentStatusFilter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    post:
      tags: [09 Enrollments & Classroom]
      operationId: manuallyEnrollStudent
      summary: Manually enroll verified student in paid batch
      x-access: ADMIN
      parameters:
        - $ref: "#/components/parameters/BatchId"
      requestBody:
        $ref: "#/components/requestBodies/CreatePaidEnrollment"
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /api/v1/batches/{batchId}/enrollments/bulk:
    post:
      tags: [09 Enrollments & Classroom]
      operationId: bulkEnrollStudents
      summary: Process batch enrollment for multiple students
      x-access: ADMIN
      description: >-
        Returns ordered per-student CREATED or FAILED results. Writes are
        serialized behind the batch-enrollment lock so capacity and duplicate
        decisions remain concurrency-safe. Once a locked transaction proves
        capacity is exhausted, the remaining eligible rows receive
        BATCH_CAPACITY_REACHED without opening additional insert transactions.
      parameters:
        - $ref: "#/components/parameters/BatchId"
      requestBody:
        $ref: "#/components/requestBodies/BulkPaidEnrollment"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/enrollments/course/{courseId}:
    get:
      tags: [09 Enrollments & Classroom]
      operationId: listCourseEnrollments
      summary: List aggregate course enrollments across batches or free delivery
      x-access: ADMIN
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/EnrollmentStatusFilter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/enrollments/{enrollmentId}/certificate:
    post:
      tags: [10 Certificates]
      operationId: issueCertificate
      summary: Issue certificate
      x-access: ADMIN
      description: >-
        Admin-only. Enrollment must be completed and the course must have
        certificates enabled. Random certificate-code collisions are retried
        up to five times; a competing certificate for the same enrollment is
        not treated as a retryable code collision.
      parameters:
        - $ref: "#/components/parameters/EnrollmentId"
      requestBody:
        $ref: "#/components/requestBodies/IssueCertificate"
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /api/v1/certificates/verify/{certificateCode}:
    get:
      tags: [10 Certificates]
      operationId: verifyCertificate
      summary: Verify certificate publicly
      x-access: PUBLIC
      security: []
      parameters:
        - $ref: "#/components/parameters/CertificateCode"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/certificates/my:
    get:
      tags: [10 Certificates]
      operationId: listOwnCertificates
      summary: List own certificates
      x-access: AUTHENTICATED
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/certificates/admin:
    get:
      tags: [10 Certificates]
      operationId: listCertificatesAdmin
      summary: List all certificates for administration
      x-access: ADMIN
      description: Admin/certificate-management permission required. Returns a bounded keyset page.
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/CertificateStatusFilter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/certificates/{certificateId}:
    get:
      tags: [10 Certificates]
      operationId: getCertificate
      summary: Get certificate detail
      x-access: AUTHENTICATED
      description: Available to the certificate owner or an admin.
      parameters:
        - $ref: "#/components/parameters/CertificateId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/certificates/{certificateId}/revoke:
    patch:
      tags: [10 Certificates]
      operationId: revokeCertificate
      summary: Revoke certificate
      x-access: ADMIN
      description: >-
        Admin/certificate-management permission required. Revocation locks the
        enrollment, rereads the certificate and its batch/catalog lifecycle in
        one transaction, and rejects a repeated revocation. A credential may
        still be revoked after its batch or catalog parents become terminal or
        archived because invalid credentials must remain revocable.
      parameters:
        - $ref: "#/components/parameters/CertificateId"
      requestBody:
        $ref: "#/components/requestBodies/RevokeCertificate"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/projects/showcase:
    get:
      tags: [11 Projects]
      operationId: listPublicProjects
      summary: List public approved projects
      x-access: PUBLIC
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/projects/showcase/{projectId}:
    get:
      tags: [11 Projects]
      operationId: getPublicProject
      summary: Get public approved project
      x-access: PUBLIC
      security: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/projects:
    post:
      tags: [11 Projects]
      operationId: submitProject
      summary: Submit project
      x-access: STUDENT
      description: Enrollment must belong to the current user and must not be cancelled.
      requestBody:
        $ref: "#/components/requestBodies/CreateProject"
      responses:
        "201":
          $ref: "#/components/responses/Created"

  /api/v1/projects/my:
    get:
      tags: [11 Projects]
      operationId: listOwnProjects
      summary: List own projects
      x-access: AUTHENTICATED
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/projects/{projectId}:
    get:
      tags: [11 Projects]
      operationId: getProject
      summary: Get project detail
      x-access: AUTHENTICATED
      description: Available to the owner, an admin, or anyone when the project is approved and public.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    patch:
      tags: [11 Projects]
      operationId: updateProject
      summary: Update pending project
      x-access: STUDENT
      description: The current user must own the project and it must still be pending.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        $ref: "#/components/requestBodies/UpdateProject"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/projects/admin/all:
    get:
      tags: [11 Projects]
      operationId: listProjectsAdmin
      summary: List all projects for review
      x-access: ADMIN
      description: Admin/project-review permission required.
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/projects/{projectId}/review:
    patch:
      tags: [11 Projects]
      operationId: reviewProject
      summary: Review project
      x-access: ADMIN
      description: Admin/project-review permission required.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        $ref: "#/components/requestBodies/ReviewProject"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /api/v1/audit/logs:
    get:
      tags: [12 Audit Logs]
      operationId: listAuditLogs
      summary: Search audit logs
      x-access: SUPER_ADMIN
      description: Super-admin only.
      parameters:
        - name: action
          in: query
          schema: { type: string }
          example: COURSE_PUBLISHED
        - name: resourceType
          in: query
          schema: { type: string }
          example: COURSE
        - name: actorUserId
          in: query
          schema: { type: string, format: uuid }
          example: "{{currentUserId}}"
        - name: entityId
          in: query
          schema: { type: string }
          example: "{{courseId}}"
        - name: from
          in: query
          schema: { type: string, format: date-time }
          example: "2026-08-01T00:00:00.000Z"
        - name: to
          in: query
          schema: { type: string, format: date-time }
          example: "2026-08-31T23:59:59.999Z"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          $ref: "#/components/responses/Success"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: Set automatically by Login or Verify email OTP.

  responses:
    Success:
      description: Successful API response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SuccessEnvelope"
    Created:
      description: Resource created successfully
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SuccessEnvelope"
    Error:
      description: Standard API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    SequenceRisk:
      description: Explicit confirmation is required because the operation breaks curriculum sequence.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SequenceRiskEnvelope"
    CatalogDeletionBlocked:
      description: Permanent deletion would destroy operational delivery or protected learner history.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CatalogDeletionBlockedEnvelope"

  parameters:
    TargetUserId:
      name: targetUserId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: "{{targetUserId}}"
    ServiceSlug:
      name: serviceSlug
      in: path
      required: true
      schema:
        type: string
        enum: [bootcamps, pretech-courses, free-learning]
      example: "{{serviceSlug}}"
    CategorySlug:
      name: categorySlug
      in: path
      required: true
      schema: { type: string }
      example: "{{categorySlug}}"
    CourseSlug:
      name: courseSlug
      in: path
      required: true
      schema: { type: string }
      example: "{{courseSlug}}"
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: "{{categoryId}}"
    CourseId:
      name: courseId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: "{{courseId}}"
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: "{{sessionId}}"
    CourseSessionId:
      name: courseSessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: "{{courseSessionId}}"
    BatchId:
      name: batchId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: "{{batchId}}"
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: "{{enrollmentId}}"
    CertificateId:
      name: certificateId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: "{{certificateId}}"
    CertificateCode:
      name: certificateCode
      in: path
      required: true
      schema: { type: string, minLength: 20, maxLength: 64 }
      example: "{{certificateCode}}"
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: "{{projectId}}"
    RoleFilter:
      name: role
      in: query
      schema:
        $ref: "#/components/schemas/Role"
      example: STUDENT
    ServiceTypeFilter:
      name: serviceType
      in: query
      schema:
        $ref: "#/components/schemas/LearningServiceType"
      example: BOOTCAMPS
    CategoryIdFilter:
      name: categoryId
      in: query
      schema: { type: string, format: uuid }
      example: "{{categoryId}}"
    CatalogStatusFilter:
      name: status
      in: query
      schema:
        $ref: "#/components/schemas/CatalogStatus"
      example: DRAFT
    CourseLevelFilter:
      name: level
      in: query
      schema:
        $ref: "#/components/schemas/CourseLevel"
      example: BEGINNER
    AccessTypeFilter:
      name: accessType
      in: query
      schema:
        $ref: "#/components/schemas/CourseAccessType"
      example: FREE
    SearchQuery:
      name: q
      in: query
      schema: { type: string }
      example: ai
    SessionStatusFilter:
      name: status
      in: query
      schema:
        $ref: "#/components/schemas/SessionStatus"
      example: READY
    SessionReusePolicyFilter:
      name: reusePolicy
      in: query
      schema:
        $ref: "#/components/schemas/SessionReusePolicy"
      example: REUSABLE
    AttachableCourseIdFilter:
      name: attachableCourseId
      in: query
      description: Return picker candidates with no active or retired relationship to this course. Reusable sessions may belong to other courses; one-course sessions must be unused. Retired relationships are restored from the course curriculum history instead of this picker.
      schema: { type: string, format: uuid }
      example: "{{courseId}}"
    BatchStatusFilter:
      name: status
      in: query
      schema:
        $ref: "#/components/schemas/BatchStatus"
      example: ACTIVE
    EnrollmentStatusFilter:
      name: status
      in: query
      schema:
        $ref: "#/components/schemas/EnrollmentStatus"
      example: ACTIVE
    CertificateStatusFilter:
      name: status
      in: query
      schema:
        $ref: "#/components/schemas/CertificateStatus"
      example: ISSUED
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque next-page cursor returned by the preceding response. It is valid only with the same resource scope and filters.
      schema: { type: string, maxLength: 1024 }
    EligibleLimit:
      name: limit
      in: query
      description: Page size. Use cursor for additional pages instead of increasing the limit.
      schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
    EligibleCursor:
      name: cursor
      in: query
      description: Opaque next-page cursor returned by the preceding eligible-student response. It is valid only with the same batch and search query.
      schema: { type: string, maxLength: 512 }
      example: "{{eligibleStudentsCursor}}"
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }

  requestBodies:
    Register:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RegisterInput"
          example:
            firstName: Test
            lastName: Student
            email: "{{registrationEmail}}"
            password: "{{registrationPassword}}"
            phone: "0751234567"
            address: "123 Academy Road"
            district: Colombo
            dateOfBirth: "2000-01-01"
            alStream: Technology
    Login:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LoginInput"
          example:
            email: "{{loginEmail}}"
            password: "{{loginPassword}}"
    Email:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            properties:
              email: { type: string, format: email }
          example:
            email: "{{registrationEmail}}"
    ResetPassword:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token, newPassword]
            properties:
              token: { type: string }
              newPassword: { type: string, minLength: 8, format: password }
          example:
            token: "{{resetToken}}"
            newPassword: "{{registrationPassword}}"
    VerifyOtp:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, code]
            properties:
              email: { type: string, format: email }
              code: { type: string, pattern: "^[0-9]{6}$" }
          example:
            email: "{{registrationEmail}}"
            code: "{{otpCode}}"
    UpdateProfile:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateProfileInput"
          example:
            firstName: Updated
            lastName: Student
            phone: "0751234567"
            address: "456 Foundry Road"
            district: Colombo
            dateOfBirth: "2000-01-01T00:00:00.000Z"
            alStream: Technology
    CreateCategory:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateCategoryInput"
          example:
            serviceType: BOOTCAMPS
            slug: api-testing
            title: API Testing
            description: Practical API testing courses for software engineers.
            audienceLabel: Beginner friendly
            visualKey: code2
            badgeLabel: New
            sortOrder: 0
    UpdateCategory:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateCategoryInput"
          example:
            title: API Testing and Quality
            description: Practical API testing and quality courses for software engineers.
            sortOrder: 1
    CreateCourse:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateCourseInput"
          example:
            categoryId: "{{categoryId}}"
            slug: postman-foundations
            title: Postman Foundations
            summary: Learn practical API exploration and automated request testing.
            description: Build reliable Postman workflows for modern HTTP APIs from first request to regression collection.
            level: BEGINNER
            durationValue: 4
            durationUnit: WEEK
            accessType: FREE
            price: 0
            certificateEnabled: true
            highlights: [Requests, Environments, Tests]
            skills: [Postman, HTTP, API Testing]
            prerequisites: [Basic web knowledge]
            thumbnailUrl: null
            sortOrder: 0
    UpdateCourse:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateCourseInput"
          example:
            title: Postman and API Testing Foundations
            summary: Learn practical API exploration, environments, and automated tests.
    SetCourseEnrollmentStatus:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status:
                $ref: "#/components/schemas/CourseEnrollmentStatus"
          example:
            status: OPEN
    CreateSession:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateSessionInput"
          example:
            title: Understanding HTTP Requests
            description: Learn methods, headers, bodies, and response codes.
            recordingUrl: "https://example.com/recordings/http"
            materialUrl: "https://example.com/materials/http"
            quizUrl: null
            feedbackUrl: null
            durationMinutes: 60
            reusePolicy: REUSABLE
            status: READY
    UpdateSession:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateSessionInput"
          example:
            title: Understanding HTTP Requests and Responses
            durationMinutes: 75
            status: READY
    AttachCourseSession:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [sessionId]
            properties:
              sessionId: { type: string, format: uuid }
              orderIndex: { type: integer, minimum: 0 }
          example:
            sessionId: "{{sessionId}}"
            orderIndex: 0
    ReorderCourseCurriculum:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [courseSessions]
            properties:
              courseSessions:
                type: array
                items:
                  type: object
                  required: [id, orderIndex]
                  properties:
                    id: { type: string, format: uuid }
                    orderIndex: { type: integer, minimum: 0 }
              acknowledgeSequenceRisk: { type: boolean, default: false }
          example:
            courseSessions:
              - id: "{{courseSessionId}}"
                orderIndex: 0
            acknowledgeSequenceRisk: false
    CreateBatch:
      required: true
      content:
        application/json:
          schema: { type: object }
          example:
            name: August 2026
            code: ML1-2026-AUG
            startDate: "2026-08-01"
            expectedEndDate: "2026-12-01"
            timezone: Asia/Colombo
            capacity: 30
    UpdateBatch:
      required: true
      content:
        application/json:
          schema: { type: object }
          example:
            name: August 2026 - Batch 1
            capacity: 35
    UpdateBatchStatus:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status:
                $ref: "#/components/schemas/BatchStatus"
          example:
            status: ENROLLING
    UpdateBatchSessionDelivery:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [mode]
            properties:
              mode:
                type: string
                enum: [UNRELEASED, RELEASED, SCHEDULED]
              availableAt: { type: string, format: date-time, nullable: true }
              acknowledgeSequenceRisk: { type: boolean, default: false }
          example:
            mode: RELEASED
            availableAt: null
            acknowledgeSequenceRisk: false
    CreatePaidEnrollment:
      required: true
      content:
        application/json:
          schema: { type: object }
          example:
            userId: "{{targetUserId}}"
            paymentStatus: COMPLETED
            externalPaymentReference: PAY-2026-0001
            paymentNote: Payment confirmed outside the LMS.
    BulkPaidEnrollment:
      required: true
      content:
        application/json:
          schema: { type: object }
          example:
            students:
              - userId: "{{targetUserId}}"
                paymentStatus: COMPLETED
                externalPaymentReference: PAY-2026-0001
    UpdateEnrollment:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                $ref: "#/components/schemas/EnrollmentStatus"
              paymentStatus:
                $ref: "#/components/schemas/PaymentStatus"
              externalPaymentReference: { type: string, nullable: true }
              paymentNote: { type: string, nullable: true }
          example:
            status: ACTIVE
            paymentStatus: COMPLETED
            externalPaymentReference: PAY-2026-0001
    IssueCertificate:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              description: { type: string, nullable: true }
              issuedDate: { type: string, format: date-time }
          example:
            description: Successfully completed all course requirements.
    RevokeCertificate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [revocationReason]
            properties:
              revocationReason: { type: string, minLength: 5 }
          example:
            revocationReason: Issued using incorrect enrollment information.
    CreateProject:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateProjectInput"
          example:
            courseId: "{{courseId}}"
            enrollmentId: "{{enrollmentId}}"
            title: Foundry API Test Suite
            description: A reusable automated API regression collection.
            thumbnailUrl: "https://example.com/project-thumbnail.png"
            projectUrl: "https://example.com/projects/foundry-api"
            githubUrl: "https://github.com/example/foundry-api-tests"
            demoUrl: null
            technologies: [Postman, JavaScript]
            isPublic: true
    UpdateProject:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateProjectInput"
          example:
            title: Foundry LMS API Regression Suite
            description: An updated reusable API regression collection.
            isPublic: true
    ReviewProject:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status:
                type: string
                enum: [PENDING, APPROVED, REJECTED]
              adminFeedback: { type: string, nullable: true }
          example:
            status: APPROVED
            adminFeedback: Strong API coverage and clear organization.

  schemas:
    SuccessEnvelope:
      type: object
      required: [success]
      properties:
        success: { type: boolean, example: true }
        data: {}
        message: { type: string, example: Success }
    ErrorEnvelope:
      type: object
      required: [success, error, code]
      properties:
        success: { type: boolean, example: false }
        error: { type: string }
        code: { type: string }
        field: { type: string, nullable: true }
        details: { nullable: true }
    SequenceRiskEnvelope:
      type: object
      required: [success, error, code, details]
      properties:
        success: { type: boolean, example: false }
        error: { type: string }
        code:
          type: string
          enum: [SEQUENCE_RISK_CONFIRMATION_REQUIRED]
        details:
          type: object
          required: [warningCode, confirmationText]
          properties:
            warningCode: { type: string }
            confirmationText: { type: string, enum: [CONFIRM] }
            affectedBatchCount: { type: integer, minimum: 0 }
            affectedBatches: { type: array, items: { type: object } }
            conflicts: { type: array, items: { type: object } }
    CatalogDeletionBlockedEnvelope:
      type: object
      required: [success, error, code, details]
      properties:
        success: { type: boolean, example: false }
        error:
          type: string
          example: Permanent deletion is blocked because this catalog item contains operational batches or learner history.
        code:
          type: string
          enum: [CATALOG_DELETION_BLOCKED]
        details:
          $ref: "#/components/schemas/CatalogDeletionImpact"
    CatalogDeletionImpact:
      type: object
      required: [resourceType, resourceId, status, canDelete, summary, blockers]
      properties:
        resourceType: { type: string, enum: [CATEGORY, COURSE] }
        resourceId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/CatalogStatus" }
        canDelete: { type: boolean }
        summary:
          type: object
          required: [courses, unarchivedCourses, batches, operationalBatches, enrollments, completions, certificates, projects, curriculumLinks, exclusiveSessions, reusableSessions]
          properties:
            courses: { type: integer, minimum: 0 }
            unarchivedCourses: { type: integer, minimum: 0 }
            batches: { type: integer, minimum: 0 }
            operationalBatches: { type: integer, minimum: 0 }
            enrollments: { type: integer, minimum: 0 }
            completions: { type: integer, minimum: 0 }
            certificates: { type: integer, minimum: 0 }
            projects: { type: integer, minimum: 0 }
            curriculumLinks: { type: integer, minimum: 0 }
            exclusiveSessions: { type: integer, minimum: 0 }
            reusableSessions: { type: integer, minimum: 0 }
        blockers:
          type: array
          items:
            type: object
            required: [code, count, message]
            properties:
              code:
                type: string
                enum: [RESOURCE_NOT_ARCHIVED, UNARCHIVED_COURSES, OPERATIONAL_BATCHES, ENROLLMENT_HISTORY, COMPLETION_HISTORY, CERTIFICATE_HISTORY, PROJECT_HISTORY]
              count: { type: integer, minimum: 1 }
              message: { type: string }
    Role:
      type: string
      enum: [STUDENT, ADMIN, SUPER_ADMIN]
    LearningServiceType:
      type: string
      enum: [BOOTCAMPS, PRETECH, FREE_LEARNING]
    CatalogStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]
    CourseLevel:
      type: string
      enum: [OPEN, FOUNDATION, BEGINNER, INTERMEDIATE, ADVANCED]
    CourseAccessType:
      type: string
      enum: [FREE, PAID]
    CourseEnrollmentStatus:
      type: string
      enum: [COMING_SOON, OPEN, CLOSED]
    DurationUnit:
      type: string
      enum: [SESSION, DAY, WEEK, MONTH]
    EnrollmentStatus:
      type: string
      enum: [ACTIVE, COMPLETED, CANCELLED]
    PaymentStatus:
      type: string
      enum: [NOT_REQUIRED, PENDING, PARTIAL, COMPLETED]
    SessionReusePolicy:
      type: string
      enum: [SINGLE_COURSE, REUSABLE]
    SessionStatus:
      type: string
      enum: [DRAFT, READY, ARCHIVED]
    BatchStatus:
      type: string
      enum: [DRAFT, ENROLLING, ACTIVE, COMPLETED, CANCELLED, ARCHIVED]
    RegisterInput:
      type: object
